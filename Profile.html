<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: lightblue;
            text-align: center;
        }

        .container{
            width:300px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
        }

        input{
            width:100%;
            padding:8px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background-color:green;
            color:white;
            border:none;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background-color:darkgreen;
        }

        .card{
            width:300px;
            margin:20px auto;
            padding:20px;
            background:white;
            border:2px solid black;
            border-radius:10px;
            text-align:left;
        }

        h2,h3{
            text-align:center;
        }
    </style>

</head>
<body>

    <h2>Student Profile Card</h2>

    <div class="container">

        <label><b>Student Name</b></label>
        <input type="text" id="name" placeholder="Enter Name">

        <label><b>Roll Number</b></label>
        <input type="text" id="roll" placeholder="Enter Roll Number">

        <label><b>Marks</b></label>
        <input type="number" id="marks" placeholder="Enter Marks">

        <button onclick="displayProfile()">Display Profile</button>

    </div>

    <div class="card">

        <h3>Student Profile</h3>

        <p><b>Name :</b> <span id="sname"></span></p>

        <p><b>Roll No :</b> <span id="sroll"></span></p>

        <p><b>Marks :</b> <span id="smarks"></span></p>

        <p><b>Grade :</b> <span id="sgrade"></span></p>

    </div>

    <script>

        function displayProfile(){

            let name = document.getElementById("name").value;
            let roll = document.getElementById("roll").value;
            let marks = Number(document.getElementById("marks").value);

            let grade;

            if(marks >= 90){
                grade = "A";
            }
            else if(marks >= 80){
                grade = "B";
            }
            else if(marks >= 70){
                grade = "C";
            }
            else if(marks >= 60){
                grade = "D";
            }
            else{
                grade = "F";
            }

            document.getElementById("sname").innerHTML = name;
            document.getElementById("sroll").innerHTML = roll;
            document.getElementById("smarks").innerHTML = marks;
            document.getElementById("sgrade").innerHTML = grade;

        }

    </script>

</body>
</html>
